name: Lint Knip

on:
  # pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  lint_knip:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare
      - run: pnpm run lint:knip
